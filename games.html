<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subway Surfers</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}
#gameScreen{width:100%;height:100%;background:#000}
.gamebar{height:62px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;background:#0d111a;border-bottom:1px solid #252d3b}
.gamebar strong{font-size:16px}
.close{border:0;border-radius:10px;padding:9px 13px;background:#252d3b;color:#fff;font-weight:700}
#frame{display:block;width:100%;height:calc(100dvh - 62px);border:0;background:#000}
</style>
</head>
<body>
<div id="gameScreen">
<div class="gamebar">
<strong>🚇 Subway Surfers</strong>
<button class="close" onclick="document.getElementById('frame').src='about:blank';history.back()">Close</button>
</div>
<iframe id="frame" title="Subway Surfers" src="https://www.madkidgames.com/full/subway-surfers" allow="fullscreen; autoplay; gamepad" allowfullscreen scrolling="no"></iframe>
</div>
</body>
</html>
