<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delta Executor — Direct Install</title>
<meta name="description" content="Direct install for Delta Executor">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <section class="card" aria-label="Delta Executor">
    <div class="pill">BEST EXECUTOR</div>

    <div class="app-icon">
      <img src="assets/delta-icon.png" alt="Delta Executor app icon"
           onerror="this.hidden=true;document.querySelector('.delta-fallback').hidden=false">
      <span class="delta-fallback" hidden>Δ</span>
    </div>

    <h1>Delta Executor</h1>
    <p class="subtitle">Trusted Direct install and Working Delta version</p>

    <div class="version">V2.733.988</div>
    <div class="working"><i></i>Working</div>

    <div class="buttons">
      <a class="install" href="itms-services://?action=download-manifest&url=https://delta.bz/manifest.plist" id="install">
        Install
      </a>

      <a class="discord"
         href="https://discord.gg/"
         target="_blank"
         rel="noopener">
        Discord server
      </a>
    </div>
  </section>
</div>
</body>
</html>
